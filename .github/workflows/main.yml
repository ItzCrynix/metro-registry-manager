name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Compilar o programa
      run: make all  # Mude aqui para o seu arquivo principal ou 'make' se tiver um Makefile
    
    - name: Pré-execução dos testes
      run: ./main < "./testes/init.in"

    - name: Executar todos os testes
      continue-on-error: true
      run: |
        erro=0
        for arquivo_in in ./testes/*.in; do
          nome=$(basename "$arquivo_in" .in)
          arquivo_out="./testes/${nome}.out"
          arquivo_res="./testes/${nome}.res"
          
          echo "====================================================="
          echo "Rodando Teste: $nome"

          ./main < "$arquivo_in" > "$arquivo_res"
          
          if diff -w -Z "$arquivo_out" "$arquivo_res" > /dev/null; then
            echo "✅ Teste $nome PASSOU!"
          else
            echo "❌ Teste $nome FALHOU!"
            echo "----------------------------"
            echo "ESPERADO:"
            cat "$arquivo_out"
            echo "----------------------------"
            echo "RESULTADO:"
            cat "$arquivo_res"
            erro=1
          fi
        done

        if [ $erro -ne 0 ]; then
          exit 1
        fi