name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Compilar o programa
      run: |
        echo "=== Building project ==="
        make all

    - name: Executar todos os testes
      run: |
        #!/usr/bin/env bash

        # Exit immediately if a command exits with a non-zero status
        set -e

        echo ""
        echo "=== Running testes ==="

        passed=0
        failed=0

        # Loop through all .in arquivos in the testes directory
        for infile in $(ls testes/*.in | sort -V); do
            # Copy support arquivos if they exist, hiding errors if they don't
            cp testes/arquivos/* . 2>/dev/null || true
            
            name=$(basename "$infile" .in)
            outfile="testes/$name.out"

            if [ ! -f "$outfile" ]; then
                echo "SKIP $name (no .out file)"
                continue
            fi

            actual=$(./main < "$infile" 2>/dev/null | tr -d '\r' | xargs)
            expected=$(cat "$outfile" | tr -d '\r' | xargs)

            if [ "$actual" = "$expected" ]; then
                echo "PASS $name"
                passed=$((passed + 1))
            else
                echo "FAIL $name"
                echo "  expected:   $expected"
                echo "  actual:     $actual"
                failed=$((failed + 1))
            fi

            for f in *.bin; do
                [ -f "testes/arquivos/$f" ] || rm -f "$f"
            done
        done

        echo ""
        echo "Results: $passed passed, $failed failed"

        # Exit with an error code if any testes failed so CI or other tools notice
        if [ $failed -eq 0 ]; then
            exit 1
        fi